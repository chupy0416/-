<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알까기 게임 (Alkkagi)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&display=swap');
       
        body {
            font-family: 'Noto Sans KR', sans-serif;
            touch-action: none; /* 모바일 드래그 시 스크롤 방지 */
            user-select: none;
        }

        .board-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        canvas {
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- 상단 헤더 및 점수판 -->
    <header class="w-full max-w-4xl flex flex-col sm:flex-row justify-between items-center gap-3 my-2 px-4 py-3 rounded-2xl glass-panel text-slate-800 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-amber-600 text-white rounded-xl shadow-md">
                <i class="fa-solid fa-circle-dot text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">온라인 알까기 게임</h1>
                <p class="text-xs text-slate-500">정통 바둑알 알까기 대전</p>
            </div>
        </div>

        <!-- 턴 & 남아있는 돌 현황 -->
        <div class="flex items-center gap-6 bg-slate-100 px-5 py-2 rounded-xl border border-slate-200">
            <!-- 흑돌 현황 -->
            <div id="black-status" class="flex items-center gap-2 transition-all duration-300">
                <div class="w-6 h-6 rounded-full bg-slate-900 border-2 border-slate-700 shadow-sm flex items-center justify-center">
                    <span class="w-2 h-2 rounded-full bg-slate-100 opacity-60"></span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-slate-500">흑돌</span>
                    <div id="black-stones-count" class="flex gap-1 text-slate-800 text-sm">
                        <!-- 잔여 돌 아이콘 생성 영역 -->
                    </div>
                </div>
            </div>

            <div class="h-8 w-px bg-slate-300"></div>

            <!-- 백돌 현황 -->
            <div id="white-status" class="flex items-center gap-2 transition-all duration-300">
                <div class="w-6 h-6 rounded-full bg-slate-100 border-2 border-slate-300 shadow-sm flex items-center justify-center">
                    <span class="w-2 h-2 rounded-full bg-slate-400 opacity-40"></span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-slate-500">백돌</span>
                    <div id="white-stones-count" class="flex gap-1 text-slate-800 text-sm">
                        <!-- 잔여 돌 아이콘 생성 영역 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="flex gap-2">
            <button id="sound-btn" class="p-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 transition" title="소리 토글">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="reset-btn" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold transition shadow-md hover:shadow-lg">
                <i class="fa-solid fa-rotate-right"></i>
                <span>재시작</span>
            </button>
        </div>
    </header>

    <!-- 턴 표시 배너 (바둑판 외부) -->
    <div id="turn-banner" class="w-full max-w-md my-1 py-2 px-6 rounded-full glass-panel shadow-md text-sm font-bold text-slate-800 transition-all duration-300 flex items-center justify-center gap-2">
        <span id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-black shadow-sm"></span>
        <span id="turn-text" class="text-base font-extrabold">흑돌의 차례입니다</span>
    </div>

    <!-- 게임 바둑판 캔버스 영역 -->
    <main id="board-container" class="relative flex-1 flex items-center justify-center w-full max-w-full my-auto p-1 sm:p-2 min-h-0">
        <div id="canvas-wrapper" class="relative rounded-2xl overflow-hidden board-shadow border-8 border-amber-950 bg-amber-800 flex items-center justify-center">
            <canvas id="gameCanvas" class="block"></canvas>

            <!-- Winner Overlay Modal -->
            <div id="winner-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity">
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-white/20 transform scale-95 transition-transform">
                    <div id="winner-icon" class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center text-4xl shadow-inner">
                        🏆
                    </div>
                    <h2 id="winner-title" class="text-2xl font-black text-slate-800 mb-2">승리!</h2>
                    <p id="winner-desc" class="text-slate-600 mb-6">상대방의 모든 알을 밀어냈습니다.</p>
                    <button id="modal-restart-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold rounded-2xl shadow-lg transition transform hover:-translate-y-0.5">
                        새 게임 시작하기
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 가이드 메시지 -->
    <footer class="text-center text-xs text-slate-400 py-2 flex items-center gap-2">
        <i class="fa-solid fa-circle-info"></i> 알을 뒤로 당겼다 놓으면 발사됩니다. (판 넘어에서도 적당량 차징 지원)
    </footer>

    <script>
        // ==========================================
        // 사운드 시스템 (Web Audio API)
        // ==========================================
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playHit(volume = 1) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
               
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);

                gain.gain.setValueAtTime(Math.min(volume, 1.0) * 0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.08);
            }

            playFall() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playShoot() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const sound = new SoundManager();

        // ==========================================
        // 기본 바둑알 (Stone) 클래스 - 원래 디자인 및 크기
        // ==========================================
        class Stone {
            constructor(x, y, radius, team, id) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.team = team; // 'black' 또는 'white'
                this.id = id;
               
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.935; // 저항/마찰력 (미끄러짐 적당히 제한)
                this.mass = 1.0; // 동일한 무게

                this.isAlive = true;
                this.isFalling = false;
                this.scale = 1.0;
                this.opacity = 1.0;
            }

            update(boardBounds) {
                if (!this.isAlive) return;

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= this.friction;
                this.vy *= this.friction;

                if (Math.hypot(this.vx, this.vy) < 0.1) {
                    this.vx = 0;
                    this.vy = 0;
                }

                // 바둑판 이탈 판정
                if (!this.isFalling) {
                    if (this.x < boardBounds.left || this.x > boardBounds.right ||
                        this.y < boardBounds.top || this.y > boardBounds.bottom) {
                        this.isFalling = true;
                        sound.playFall();
                    }
                }

                if (this.isFalling) {
                    this.scale -= 0.05;
                    this.opacity -= 0.05;
                    if (this.scale <= 0) {
                        this.isAlive = false;
                    }
                }
            }

            draw(ctx) {
                if (!this.isAlive) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.globalAlpha = Math.max(0, this.opacity);

                // 그림자
                if (!this.isFalling) {
                    ctx.beginPath();
                    ctx.arc(3, 4, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    ctx.fill();
                }

                // 바둑알 본체 (입체감 있는 입체 그라데이션)
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);

                if (this.team === 'black') {
                    // 흑돌
                    const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#475569');
                    grad.addColorStop(0.5, '#1e293b');
                    grad.addColorStop(1, '#020617');
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.strokeStyle = '#020617';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 은은한 반사광
                    ctx.beginPath();
                    ctx.arc(-this.radius * 0.25, -this.radius * 0.25, this.radius * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.fill();
                } else {
                    // 백돌
                    const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.7, '#f1f5f9');
                    grad.addColorStop(1, '#cbd5e1');
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // 은은한 하이라이트
                    ctx.beginPath();
                    ctx.arc(-this.radius * 0.25, -this.radius * 0.25, this.radius * 0.35, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.fill();
                }

                ctx.restore();
            }

            isStopped() {
                return this.vx === 0 && this.vy === 0 && !this.isFalling;
            }
        }

        // 충돌 파티클
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.03;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // ==========================================
        // 메인 게임 엔진
        // ==========================================
        class AlkkagiGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.stones = [];
                this.particles = [];
                this.currentTurn = 'black'; // 'black' 또는 'white'
                this.gameState = 'IDLE';
               
                this.selectedStone = null;
                this.dragStartPos = { x: 0, y: 0 };
                this.dragCurrentPos = { x: 0, y: 0 };
                this.maxDragDistance = 150; // 판 밖 차징 한계 거리
                this.shootPowerMultiplier = 0.25;

                this.boardSize = 0;
                this.padding = 0;
                this.gridCount = 10;
                this.boardBounds = { left: 0, right: 0, top: 0, bottom: 0 };
                this.stoneRadius = 0;

                this.initUI();
                this.resizeCanvas();
                this.initGame();
                this.setupEventListeners();

                requestAnimationFrame(() => this.gameLoop());
            }

            initUI() {
                document.getElementById('reset-btn').addEventListener('click', () => this.initGame());
                document.getElementById('modal-restart-btn').addEventListener('click', () => {
                    document.getElementById('winner-modal').classList.add('hidden');
                    this.initGame();
                });

                const soundBtn = document.getElementById('sound-btn');
                soundBtn.addEventListener('click', () => {
                    sound.muted = !sound.muted;
                    soundBtn.innerHTML = sound.muted
                        ? '<i class="fa-solid fa-volume-xmark text-lg text-red-500"></i>'
                        : '<i class="fa-solid fa-volume-high text-lg"></i>';
                });
            }

            resizeCanvas() {
                const container = document.getElementById('board-container');
                if (!container) return;

                const availWidth = container.clientWidth - 20;

                const headerHeight = document.querySelector('header')?.offsetHeight || 70;
                const bannerHeight = document.getElementById('turn-banner')?.offsetHeight || 40;
                const footerHeight = document.querySelector('footer')?.offsetHeight || 30;
                const availHeight = window.innerHeight - headerHeight - bannerHeight - footerHeight - 50;

                // 최대 1000px까지 확장
                const size = Math.floor(Math.max(320, Math.min(availWidth, availHeight)));

                this.canvas.width = size;
                this.canvas.height = size;
                this.canvas.style.width = `${size}px`;
                this.canvas.style.height = `${size}px`;

                this.boardSize = size;
                this.padding = size * 0.07;
               
                this.boardBounds = {
                    left: this.padding * 0.5,
                    right: size - this.padding * 0.5,
                    top: this.padding * 0.5,
                    bottom: size - this.padding * 0.5
                };

                // 모든 알 동일 크기
                this.stoneRadius = (size - this.padding * 2) / (this.gridCount - 1) * 0.42;

                if (this.stones.length > 0) {
                    this.initGame();
                }
            }

            initGame() {
                this.stones = [];
                this.particles = [];
                this.currentTurn = 'black';
                this.gameState = 'IDLE';

                const gridSpacing = (this.boardSize - this.padding * 2) / (this.gridCount - 1);
                const cols = [1, 2, 3, 4, 5, 6, 7, 8]; // 8개의 알 배치

                // 흑돌 (아래쪽)
                cols.forEach((col, idx) => {
                    const x = this.padding + col * gridSpacing;
                    const y = this.padding + (this.gridCount - 2) * gridSpacing;
                    this.stones.push(new Stone(x, y, this.stoneRadius, 'black', `b_${idx}`));
                });

                // 백돌 (위쪽)
                cols.forEach((col, idx) => {
                    const x = this.padding + col * gridSpacing;
                    const y = this.padding + 1 * gridSpacing;
                    this.stones.push(new Stone(x, y, this.stoneRadius, 'white', `w_${idx}`));
                });

                this.updateUI();
            }

            updateUI() {
                const blackCount = this.stones.filter(s => s.team === 'black' && s.isAlive).length;
                const whiteCount = this.stones.filter(s => s.team === 'white' && s.isAlive).length;

                const blackContainer = document.getElementById('black-stones-count');
                const whiteContainer = document.getElementById('white-stones-count');

                blackContainer.innerHTML = Array(blackCount).fill('<i class="fa-solid fa-circle text-slate-800"></i>').join('');
                whiteContainer.innerHTML = Array(whiteCount).fill('<i class="fa-solid fa-circle text-slate-300"></i>').join('');

                const turnDot = document.getElementById('turn-dot');
                const turnText = document.getElementById('turn-text');

                if (this.currentTurn === 'black') {
                    turnDot.className = "w-3.5 h-3.5 rounded-full bg-slate-900 shadow-sm";
                    turnText.innerText = "흑돌의 차례입니다";
                    document.getElementById('black-status').style.opacity = '1.0';
                    document.getElementById('white-status').style.opacity = '0.4';
                } else {
                    turnDot.className = "w-3.5 h-3.5 rounded-full bg-slate-200 border border-slate-400 shadow-sm";
                    turnText.innerText = "백돌의 차례입니다";
                    document.getElementById('black-status').style.opacity = '0.4';
                    document.getElementById('white-status').style.opacity = '1.0';
                }
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.resizeCanvas());

                const getPos = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                };

                const handleStart = (e) => {
                    if (this.gameState !== 'IDLE') return;
                   
                    const pos = getPos(e);
                    const clickedStone = this.stones.find(s => {
                        if (!s.isAlive || s.team !== this.currentTurn) return false;
                        return Math.hypot(s.x - pos.x, s.y - pos.y) <= s.radius * 1.5;
                    });

                    if (clickedStone) {
                        this.selectedStone = clickedStone;
                        this.dragStartPos = { x: clickedStone.x, y: clickedStone.y };
                        this.dragCurrentPos = pos;
                        this.gameState = 'AIMING';
                    }
                };

                const handleMove = (e) => {
                    if (this.gameState !== 'AIMING') return;
                    this.dragCurrentPos = getPos(e);
                };

                const handleEnd = () => {
                    if (this.gameState !== 'AIMING') return;

                    const dx = this.dragStartPos.x - this.dragCurrentPos.x;
                    const dy = this.dragStartPos.y - this.dragCurrentPos.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 10) {
                        const limitedDist = Math.min(dist, this.maxDragDistance);
                        const angle = Math.atan2(dy, dx);
                        const power = limitedDist * this.shootPowerMultiplier;

                        this.selectedStone.vx = Math.cos(angle) * power;
                        this.selectedStone.vy = Math.sin(angle) * power;

                        sound.playShoot();
                        this.gameState = 'MOVING';
                    } else {
                        this.gameState = 'IDLE';
                    }

                    this.selectedStone = null;
                };

                this.canvas.addEventListener('mousedown', handleStart);
                window.addEventListener('mousemove', handleMove);
                window.addEventListener('mouseup', handleEnd);

                this.canvas.addEventListener('touchstart', handleStart, { passive: true });
                window.addEventListener('touchmove', handleMove, { passive: true });
                window.addEventListener('touchend', handleEnd);
            }

            updatePhysics() {
                this.stones.forEach(stone => stone.update(this.boardBounds));

                // 2D 탄성 충돌
                for (let i = 0; i < this.stones.length; i++) {
                    for (let j = i + 1; j < this.stones.length; j++) {
                        const s1 = this.stones[i];
                        const s2 = this.stones[j];

                        if (!s1.isAlive || !s2.isAlive || s1.isFalling || s2.isFalling) continue;

                        const dx = s2.x - s1.x;
                        const dy = s2.y - s1.y;
                        const dist = Math.hypot(dx, dy);
                        const minDist = s1.radius + s2.radius;

                        if (dist < minDist) {
                            const overlap = minDist - dist;
                            const nx = dx / (dist || 1);
                            const ny = dy / (dist || 1);

                            s1.x -= nx * overlap * 0.5;
                            s1.y -= ny * overlap * 0.5;
                            s2.x += nx * overlap * 0.5;
                            s2.y += ny * overlap * 0.5;

                            const kx = s1.vx - s2.vx;
                            const ky = s1.vy - s2.vy;
                            const p = 2 * (nx * kx + ny * ky) / (s1.mass + s2.mass);

                            s1.vx -= p * s2.mass * nx;
                            s1.vy -= p * s2.mass * ny;
                            s2.vx += p * s1.mass * nx;
                            s2.vy += p * s1.mass * ny;

                            const impactSpeed = Math.hypot(kx, ky);
                            if (impactSpeed > 0.5) {
                                sound.playHit(impactSpeed / 10);
                                this.createImpactParticles((s1.x + s2.x)/2, (s1.y + s2.y)/2);
                            }
                        }
                    }
                }

                this.particles.forEach((p, idx) => {
                    p.update();
                    if (p.life <= 0) this.particles.splice(idx, 1);
                });

                if (this.gameState === 'MOVING') {
                    const allStopped = this.stones.every(s => !s.isAlive || s.isStopped());
                    if (allStopped) {
                        this.checkGameStatus();
                    }
                }
            }

            createImpactParticles(x, y) {
                for (let i = 0; i < 8; i++) {
                    this.particles.push(new Particle(x, y, '#f59e0b'));
                }
            }

            checkGameStatus() {
                const blackAlive = this.stones.filter(s => s.team === 'black' && s.isAlive).length;
                const whiteAlive = this.stones.filter(s => s.team === 'white' && s.isAlive).length;

                this.updateUI();

                if (blackAlive === 0 || whiteAlive === 0) {
                    this.gameState = 'GAMEOVER';
                    this.showWinnerModal(blackAlive > 0 ? 'black' : 'white');
                } else {
                    this.currentTurn = this.currentTurn === 'black' ? 'white' : 'black';
                    this.gameState = 'IDLE';
                    this.updateUI();
                }
            }

            showWinnerModal(winner) {
                const modal = document.getElementById('winner-modal');
                const winnerIcon = document.getElementById('winner-icon');
                const winnerTitle = document.getElementById('winner-title');

                if (winner === 'black') {
                    winnerIcon.className = "w-20 h-20 mx-auto mb-4 rounded-full bg-slate-900 text-slate-100 flex items-center justify-center text-4xl shadow-inner border-2 border-slate-700";
                    winnerIcon.innerText = "●";
                    winnerTitle.innerText = "흑돌 승리!";
                } else {
                    winnerIcon.className = "w-20 h-20 mx-auto mb-4 rounded-full bg-slate-100 text-slate-800 flex items-center justify-center text-4xl shadow-inner border-2 border-slate-300";
                    winnerIcon.innerText = "○";
                    winnerTitle.innerText = "백돌 승리!";
                }

                modal.classList.remove('hidden');
            }

            drawBoard() {
                const ctx = this.ctx;
                const size = this.boardSize;

                // 은은하고 고급스러운 바둑판 질감
                const boardGrad = ctx.createLinearGradient(0, 0, size, size);
                boardGrad.addColorStop(0, '#eab308');
                boardGrad.addColorStop(1, '#ca8a04');
                ctx.fillStyle = boardGrad;
                ctx.fillRect(0, 0, size, size);

                // 테두리
                ctx.strokeStyle = '#854d0e';
                ctx.lineWidth = 4;
                ctx.strokeRect(
                    this.boardBounds.left,
                    this.boardBounds.top,
                    this.boardBounds.right - this.boardBounds.left,
                    this.boardBounds.bottom - this.boardBounds.top
                );

                // 격자선
                const gridSpacing = (size - this.padding * 2) / (this.gridCount - 1);
                ctx.beginPath();
                ctx.strokeStyle = '#713f12';
                ctx.lineWidth = 1.2;

                for (let i = 0; i < this.gridCount; i++) {
                    ctx.moveTo(this.padding, this.padding + i * gridSpacing);
                    ctx.lineTo(size - this.padding, this.padding + i * gridSpacing);
                    ctx.moveTo(this.padding + i * gridSpacing, this.padding);
                    ctx.lineTo(this.padding + i * gridSpacing, size - this.padding);
                }
                ctx.stroke();

                // 화점 (화점 점들)
                const starPoints = [2, 7];
                starPoints.forEach(row => {
                    starPoints.forEach(col => {
                        ctx.beginPath();
                        ctx.arc(
                            this.padding + col * gridSpacing,
                            this.padding + row * gridSpacing,
                            3.5, 0, Math.PI * 2
                        );
                        ctx.fillStyle = '#713f12';
                        ctx.fill();
                    });
                });
            }

            drawAimingGuide() {
                if (this.gameState !== 'AIMING' || !this.selectedStone) return;

                const ctx = this.ctx;
                const stone = this.selectedStone;

                const dx = this.dragStartPos.x - this.dragCurrentPos.x;
                const dy = this.dragStartPos.y - this.dragCurrentPos.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 5) return;

                const angle = Math.atan2(dy, dx);
                const limitedDist = Math.min(dist, this.maxDragDistance);

                const clampedDragX = stone.x - Math.cos(angle) * limitedDist;
                const clampedDragY = stone.y - Math.sin(angle) * limitedDist;

                // 당기는 조준 점선
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(stone.x, stone.y);
                ctx.lineTo(clampedDragX, clampedDragY);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();

                // 발사 예상 화살표
                const targetX = stone.x + Math.cos(angle) * limitedDist * 1.5;
                const targetY = stone.y + Math.sin(angle) * limitedDist * 1.5;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(stone.x, stone.y);
                ctx.lineTo(targetX, targetY);
               
                const powerRatio = limitedDist / this.maxDragDistance;
                const red = Math.floor(255);
                const green = Math.floor(255 * (1 - powerRatio));
                ctx.strokeStyle = `rgb(${red}, ${green}, 50)`;
                ctx.lineWidth = 4;
                ctx.stroke();

                const headLen = 12;
                ctx.beginPath();
                ctx.moveTo(targetX, targetY);
                ctx.lineTo(
                    targetX - headLen * Math.cos(angle - Math.PI / 6),
                    targetY - headLen * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    targetX - headLen * Math.cos(angle + Math.PI / 6),
                    targetY - headLen * Math.sin(angle + Math.PI / 6)
                );
                ctx.fillStyle = `rgb(${red}, ${green}, 50)`;
                ctx.fill();
                ctx.restore();
            }

            render() {
                this.drawBoard();
                this.drawAimingGuide();
                this.particles.forEach(p => p.draw(this.ctx));
                this.stones.forEach(stone => stone.draw(this.ctx));
            }

            gameLoop() {
                this.updatePhysics();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        window.onload = () => {
            new AlkkagiGame();
        };
    </script>
</body>
</html>
